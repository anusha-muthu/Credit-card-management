server:
  port: 8084

spring:
  application:
    name: transaction

  datasource:
    url: jdbc:oracle:thin:@localhost:1521/FREEPDB1
    username: ${DB_USERNAME:SYSTEM}
    password: ${DB_PASSWORD:}
    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true


services:
  card:
    url: http://localhost:8083

  merchant:
    url: http://localhost:8080

eureka:
  client:
    enabled: false	
