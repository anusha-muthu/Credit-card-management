<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <title>Merchant Details</title>

</head>

<body>

<h1>Manage Merchant Details</h1>

<form id="merchantForm">

    <label>Merchant Name:</label>

    <input type="text"
           id="merchantName"
           required>

    <br><br>


    <label>Category:</label>

    <input type="text"
           id="category"
           required>

    <br><br>


    <label>Location:</label>

    <input type="text"
           id="location"
           required>

    <br><br>


    <button type="submit">
        Update
    </button>

</form>

<p id="message"></p>


<script>

fetch("/api/merchants/me")

.then(response => {

    if (!response.ok) {
        throw new Error("Unable to get merchant details");
    }

    return response.json();

})

.then(data => {

    document.getElementById("merchantName").value =
        data.merchantName;

    document.getElementById("category").value =
        data.category;

    document.getElementById("location").value =
        data.location;

})

.catch(error => {

    document.getElementById("message").innerText =
        error.message;

});


document.getElementById("merchantForm")
.addEventListener("submit", function(event) {

    event.preventDefault();


    const updatedMerchant = {

        merchantName:
            document.getElementById("merchantName").value,

        category:
            document.getElementById("category").value,

        location:
            document.getElementById("location").value
    };


    fetch("/api/merchants/update", {

        method: "PATCH",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify(updatedMerchant)

    })

    .then(response => {

        if (!response.ok) {
            throw new Error("Update failed");
        }

        return response.json();

    })

    .then(data => {

        document.getElementById("message").innerText =
            "Details updated successfully!";

    })

    .catch(error => {

        document.getElementById("message").innerText =
            error.message;

    });

});

</script>

</body>
</html>
