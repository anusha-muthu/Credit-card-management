<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Merchant Registration</title>
</head>

<body>

<h1>Merchant Registration</h1>

<form action="/api/register/merchant" method="post">

    <label>Merchant Name:</label>
    <input type="text"
           name="merchantName"
           required>

    <br><br>

    <label>Username:</label>
    <input type="text"
           name="userName"
           required>

    <br><br>

    <label>Password:</label>
    <input type="password"
           name="password"
           required>

    <br><br>

    <label>Category:</label>
    <input type="text"
           name="category"
           required>

    <br><br>

    <label>Location:</label>
    <input type="text"
           name="location"
           required>

    <br><br>

    <button type="submit">
        Register
    </button>

</form>

</body>
</html>
